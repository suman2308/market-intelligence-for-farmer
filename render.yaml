services:
  # Backend API
  - type: web
    name: shetbhav-backend
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd shetbhav/backend && pip install -r requirements.txt
    startCommand: cd shetbhav/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shetbhav-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: true
      - key: MARKET_DATA_MODE
        value: live
      - key: DATA_GOV_API_KEY
        sync: false
      - key: IMPORT_HISTORICAL_CSV
        value: "true"
      - key: TRAIN_ON_STARTUP
        value: "true"
      - key: DATA_GOV_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: MARKET_DATA_CACHE_HOURS
        value: 24
      - key: REQUEST_TIMEOUT_SECONDS
        value: 30
      - key: FRONTEND_URL
        value: https://market-intelligence-for-farmer.vercel.app
    healthCheckPath: /health

databases:
  # PostgreSQL Database
  - name: shetbhav-db
    plan: free
    databaseName: shetbhav
