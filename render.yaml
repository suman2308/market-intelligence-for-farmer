services:
  # Backend API
  - type: web
    name: shetbhav-backend
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd shetbhav/backend && pip install -r requirements.txt
    startCommand: cd shetbhav/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shetbhav-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: true
      - key: MARKET_DATA_MODE
        value: live
      - key: DATA_GOV_API_KEY
        sync: false
      - key: DATA_GOV_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: MARKET_DATA_CACHE_HOURS
        value: 24
      - key: REQUEST_TIMEOUT_SECONDS
        value: 30
      - key: FRONTEND_URL
        value: https://shetbhav-frontend.onrender.com
    healthCheckPath: /health

  # Frontend
  - type: web
    name: shetbhav-frontend
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd shetbhav/frontend && npm install && npm run build
    startCommand: cd shetbhav/frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://shetbhav-backend.onrender.com

databases:
  # PostgreSQL Database
  - name: shetbhav-db
    plan: free
    databaseName: shetbhav
