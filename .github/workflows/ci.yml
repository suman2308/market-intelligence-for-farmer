name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shetbhav/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shetbhav/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shetbhav/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shetbhav/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: ~180 pre-existing lint findings (mostly
      # @typescript-eslint/no-explicit-any) predate this step. Surface them
      # in the log without failing the build until that debt is paid down.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shetbhav/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: shetbhav/backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: shetbhav/backend
        run: nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shetbhav/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: shetbhav/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: shetbhav/frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: shetbhav/frontend
        run: npm run build

      - name: Start frontend
        working-directory: shetbhav/frontend
        run: nohup npx next start -p 3000 > frontend.log 2>&1 &

      - name: Wait for backend and frontend to be ready
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break || sleep 2; done

      - name: Run Playwright tests
        working-directory: shetbhav/frontend
        env:
          E2E_API_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: shetbhav/frontend/playwright-report/
          retention-days: 7